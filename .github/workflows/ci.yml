name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_intel:
        description: 'Also run native Intel tests (temporarily disabled by default)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      include_intel: ${{ inputs.include_intel || false }}
